name: Update jobs

on:
  schedule:
    - cron: "17 11 * * 1-5"   # weekdays ~6:17am New York time
  workflow_dispatch:           # adds a "Run workflow" button under Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch postings
        run: python scripts/fetch_jobs.py
      - name: Save results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data.json seen.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
